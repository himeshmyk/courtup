# One-command run of the whole app (web + API in a single container).
#   docker compose up --build
# Then open http://localhost:8080
services:
  courtup:
    build:
      context: .
      args:
        # Empty -> web calls /api on the same origin (served by the API).
        VITE_API_BASE: ''
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - SERVE_STATIC=true
      - PORT=8080
      - DATABASE_URL=file:./prod.db
    # Uncomment to persist the SQLite DB across restarts:
    # volumes:
    #   - courtup-db:/app/apps/api/prisma
# volumes:
#   courtup-db:
